<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{background:transparent}
#map{position:relative;width:1000px;height:640px;border-radius:22px;overflow:hidden;background:#EEF1F5;font-family:'Archivo Narrow',Arial,sans-serif;box-shadow:0 18px 40px rgba(17,17,17,.22)}
svg{position:absolute;inset:0;width:100%;height:100%}
.river{fill:none;stroke:#1E2552;stroke-width:16;stroke-linecap:round;opacity:.85}
.road{fill:none;stroke:#fff;stroke-width:7}
.park{fill:#DCEBD9}
.lab{font:700 15px 'Archivo Narrow';fill:#7B8193;letter-spacing:1.5px;text-transform:uppercase}
.route{fill:none;stroke:#E42E2E;stroke-width:5;stroke-dasharray:12 9;stroke-linecap:round}
.pin{position:absolute;width:40px;height:40px;margin:-40px 0 0 -20px}
.pin::before{content:"";position:absolute;inset:0;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--c);box-shadow:0 4px 10px rgba(0,0,0,.3)}
.pin span{position:absolute;inset:0;display:grid;place-items:center;font:400 19px Anton,Impact,sans-serif;color:#fff;padding-bottom:4px}
.flag{position:absolute;width:230px;background:#fff;border-radius:14px;box-shadow:0 14px 30px rgba(0,0,0,.25);overflow:hidden}
.flag img{display:block;width:100%;height:92px;object-fit:cover}
.flag div{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px}
.flag b{font:700 17px/1.15 'Archivo Narrow'}
.flag small{font:400 14px 'Source Serif 4',Georgia,serif;color:#5c5b57}
.flag em{font-style:normal;font:700 12px 'Archivo Narrow';letter-spacing:1px;text-transform:uppercase;border-radius:999px;padding:3px 9px;align-self:flex-start}
.key{position:absolute;right:18px;bottom:16px;display:flex;gap:16px;background:rgba(255,255,255,.92);border-radius:10px;padding:8px 14px;font:700 14px 'Archivo Narrow';color:#1E2552}
.key i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
</style></head><body><div id="map"><svg preserveAspectRatio="none"></svg></div>
<script>
const TER=location.hash==='#territory';if(TER)document.getElementById('map').style.height='470px';
const W=1000,H=TER?470:640,B={w:152.985,e:153.080,n:-27.437,s:-27.521};
const X=lon=>(lon-B.w)/(B.e-B.w)*W, Y=lat=>(B.n-lat)/(B.n-B.s)*H;
function smooth(list){const P=list.map(p=>[X(p[1]),Y(p[0])]);let d='M'+P[0][0]+' '+P[0][1];for(let i=0;i<P.length-1;i++){const p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||p2;const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6],c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];d+=` C${c1} ${c2} ${p2}`;}return d;}
const river=[[-27.505,152.985],[-27.497,152.991],[-27.489,152.996],[-27.481,153.000],[-27.4745,153.007],[-27.4715,153.014],[-27.4725,153.0195],[-27.4765,153.0215],[-27.4800,153.0265],[-27.4775,153.0305],[-27.4710,153.0335],[-27.4640,153.0355],[-27.4610,153.0400],[-27.4655,153.0440],[-27.4735,153.0455],[-27.4775,153.0500],[-27.4735,153.0545],[-27.4655,153.0565],[-27.4565,153.0570],[-27.4500,153.0610],[-27.4440,153.0700],[-27.4400,153.0800]];
const labels=[['CBD',-27.4655,153.0245],['Fortitude Valley',-27.4525,153.0405],['Kelvin Grove',-27.4440,153.0125],['South Brisbane',-27.4865,153.0115],['Woolloongabba',-27.4895,153.0385],['Coorparoo',-27.5025,153.0640],['Annerley',-27.5180,153.0300],['East Brisbane',-27.4860,153.0530],['New Farm',-27.4660,153.0505],['Toowong',-27.4840,152.9915],['Bulimba',-27.4560,153.0690]];
// visit order for one circuit run
const V=[['Vietnam Corner QUT','Kelvin Grove','vietnam-corner',-27.4510,153.0145,0],['Vietnam House','Fortitude Valley','vietnam-house',-27.4602,153.0318,0],['The Vietnamese Restaurant','Fortitude Valley','the-vietnamese',-27.4570,153.0352,0],['Annamese Vietnamese','Brisbane CBD','annamese',-27.4700,153.0215,1],['Sum Sum','South Brisbane','sum-sum',-27.4805,153.0145,1],['SEN Legend','East Brisbane','sen-legend',-27.4840,153.0420,0],["Ben's Vietnamese & Chinese",'Woolloongabba','bens',-27.4935,153.0310,0],['Mission Vietnamese','Coorparoo','mission',-27.4950,153.0590,0],['Red Lotus Vietnamese Chargrill','Annerley','red-lotus',-27.5125,153.0325,1]];
let g='';
g+=`<ellipse class="park" cx="${X(153.0300)}" cy="${Y(-27.4755)}" rx="26" ry="18"/><ellipse class="park" cx="${X(153.0205)}" cy="${Y(-27.4790)}" rx="22" ry="34"/><ellipse class="park" cx="${X(153.0525)}" cy="${Y(-27.4690)}" rx="20" ry="15"/>`;
for(const r of [[[-27.4760,153.0285],[-27.4900,153.0350],[-27.5050,153.0400],[-27.5210,153.0460]],[[-27.4700,153.0215],[-27.4560,153.0130],[-27.4370,153.0090]],[[-27.4570,153.0350],[-27.4500,153.0450],[-27.4370,153.0560]],[[-27.4880,153.0330],[-27.4930,153.0500],[-27.4980,153.0800]]]) g+=`<path class="road" d="${smooth(r)}"/>`;
g+=`<path class="river" d="${smooth(river)}"/>`;
for(const l of labels) g+=`<text class="lab" x="${X(l[2])}" y="${Y(l[1])}" text-anchor="middle">${l[0]}</text>`;
g+=`<path class="route" d="${smooth(V.map(v=>[v[3],v[4]]))}"/>`;
document.querySelector('svg').setAttribute('viewBox',`0 0 ${W} ${H}`);document.querySelector('svg').innerHTML=g;
const m=document.getElementById('map');
V.forEach((v,i)=>{const p=document.createElement('div');p.className='pin';p.style.left=X(v[4])+'px';p.style.top=Y(v[3])+'px';p.style.setProperty('--c',v[5]?'#1F9D55':'#E42E2E');p.innerHTML=`<span>${i+1}</span>`;m.appendChild(p);});
// flags: [index, left, top]
for(const [i,l,t] of (TER?[]:[[0,40,130],[2,600,24],[7,760,205],[8,230,430]])){const v=V[i];const f=document.createElement('div');f.className='flag';f.style.left=l+'px';f.style.top=t+'px';
 f.innerHTML=`<img src="../../public/media/app/venues/${v[2]}.jpg" alt=""><div><b>${i+1}. ${v[0]}</b><small>${v[1]}</small><em style="${v[5]?'background:#E5F5EA;color:#1F6F3A">Client':'background:#FFE3E0;color:#B81F24">Cold call'}</em></div>`;m.appendChild(f);}
m.insertAdjacentHTML('beforeend','<div class="key"><span><i style="background:#1F9D55"></i>Client</span><span><i style="background:#E42E2E"></i>Cold call</span><span>— Visit order</span></div>');
</script></body></html>
